name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e .
      - name: Pytest
        run: pytest -q
      - name: Eval scenario_a
        run: python -m rag_eval --scenario scenario_a
      - name: llm-ci-gates (PASS)
        run: |
          pip install "git+https://github.com/Angelzaki/llm-ci-gates.git"
          python -m llm_ci_gates --metrics results/scenario_a.json --thresholds ci/thresholds.yaml
      - name: Upload metrics
        uses: actions/upload-artifact@v4
        with:
          name: rag-eval-metrics
          path: results/
